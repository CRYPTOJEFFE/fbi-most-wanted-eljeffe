[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eljeffe-wanted"
version = "2.0.0"
description = "Local FBI and OpenSanctions research workbench with FollowTheMoney exports"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "EL JEFFE / COPLINK contributors"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.scripts]
eljeffe = "eljeffe.cli:main"

[tool.setuptools.packages.find]
include = ["eljeffe*"]

[tool.setuptools.package-data]
eljeffe = ["web/*", "ftm_model.json"]
